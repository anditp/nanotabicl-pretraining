[project]
name = "nanotabicl-evaluation"
version = "0.1.0"
description = "Native CTR23 evaluation of the completed pretrained baseline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.5.1",
    "numpy==2.1.3",
    "scipy==1.14.1",
    "scikit-learn==1.5.2",
    "pandas==2.2.3",
    "openml==0.15.1",
]

[tool.uv]
package = false
exclude-newer = "2025-06-01T00:00:00Z"

[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
