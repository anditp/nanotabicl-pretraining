[project]
name = "nanotabicl-pretraining"
version = "0.1.0"
description = "Native GPU pretraining of the original nanoTabICL regression baseline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.5.1",
    "numpy==2.5.5",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "pandas==3.1.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
